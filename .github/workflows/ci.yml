name: Verify PrimeClock Dynamics

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Install package
        run: |
          python -m pip install --upgrade pip setuptools wheel
          python -m pip install -e ".[dev]"

      - name: Run artifact checks
        run: |
          python experiments/_workflow/check_v0_2_public_artifact.py
          python experiments/_workflow/check_v1_0_public_artifact.py
          python scripts/check_text_hygiene.py

      - name: Run tests and style checks
        run: |
          python -m pytest -q
          python -m ruff check src tests experiments scripts

      - name: Verify v0.2.0 workflow and public artifact
        run: |
          python scripts/build_artifact.py --version 0.2.0 --out "$RUNNER_TEMP" --verify-extraction
          unzip -t "$RUNNER_TEMP/PrimeClock-Dynamics-v0.2.0.zip"

      - name: Check v0.2.0 public artifact minimal surface
        run: |
          python scripts/check_public_source_surface.py --zip "$RUNNER_TEMP/PrimeClock-Dynamics-v0.2.0.zip"

      - name: Verify v1.0.0 workflow and public artifact
        run: |
          python scripts/verify_candidate_workflow.py --config experiments/_workflow/pcd_v1_0_public_artifact.json quick
          python scripts/build_artifact.py --version 1.0.0 --out "$RUNNER_TEMP" --verify-extraction
          unzip -t "$RUNNER_TEMP/PrimeClock-Dynamics-v1.0.0.zip"
